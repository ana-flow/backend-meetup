<!-- Главная страница - "Лента" -->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лента спикеров</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <div class="feed-video-wrapper">
            <!-- Автовоспроизведение вертикального видео из MinIO -->
            <video class="feed-bg-video" autoplay loop muted playsinline>
                <source src="{{ .videoUrl }}" type="video/mp4">
            </video>

            <!-- Элементы поверх видео -->
            <div class="feed-video-overlay">
                <!-- Левая часть: Имя, тема и короткое описание (2 строки) -->
                <div class="feed-speaker-info">
                    <div class="feed-speaker-name">{{ .speaker.FullName }}</div>
                    <div class="feed-topic-title">{{ .speaker.TopicTitle }}</div>
                    <div class="feed-topic-description">{{ .speaker.Description }}</div>
                </div>

                <!-- Единая правая боковая колонка: параметры по теме и кнопки -->
                <div class="feed-action-sidebar">
                    <!-- Параметры по теме -->
                    <div class="feed-sidebar-tag">🎂 {{ .speaker.BirthDate }}</div>
                    <div class="feed-sidebar-tag">⭐ {{ .speaker.ExperienceYears }} лет</div>

                    <!-- Закруглённая кнопка лайков -->
                    <div class="feed-action-btn">
                        ❤️ <span class="feed-btn-count">{{ .likesCount }}</span>
                    </div>
                    
                    <!-- Закруглённая кнопка перехода к следующему спикеру -->
                    <a href="/feed?id={{ .speaker.ID }}&next=true" class="feed-action-btn" title="Следующий">
                        ➔
                    </a>
                </div>
            </div>
        </div>

        <!-- Белая нижняя навигационная панель -->
        <nav class="tabbar">
            <a href="/feed" class="tab-item active">🎬<span>Лента</span></a>
            <a href="/draft" class="tab-item">➕<span>Добавление</span></a>
            <a href="/catalog" class="tab-item">🧱<span>Плитка</span></a>
        </nav>
    </div>
</body>
</html>
