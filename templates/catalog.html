<!-- Страница "Плитка" -->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Плитка спикеров</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <div class="page-content">
            <h2 class="page-title">Все спикеры</h2>

            <!-- Фильтрация по опыту -->
            <form action="/catalog" method="GET" class="catalog-filter-form">
                <span class="catalog-filter-label">Опыт (в годах):</span>
                <div class="filter-slider-container">
                    <input type="range" name="min_experience" class="filter-range-input" 
                           min="0" max="15" value="{{ if .minExperience }}{{ .minExperience }}{{ else }}0{{ end }}"
                           oninput="document.getElementById('exp-val').innerText = this.value + ' л.'">
                    <span id="exp-val" class="filter-value-badge">{{ if .minExperience }}{{ .minExperience }}{{ else }}0{{ end }} л.</span>
                </div>
                <button type="submit" class="catalog-search-btn">Применить</button>
            </form>

            <!-- Плитка карточек -->
            <div class="catalog-grid">
                {{ range .speakers }}
                <a href="/feed?id={{ .speaker.ID }}" class="catalog-speaker-card">
                    <img src="{{ .avatarUrl }}" class="catalog-card-thumb" alt="Аватар">
                    <div class="catalog-card-body">
                        <div>
                            <div class="catalog-card-name">{{ .speaker.FullName }}</div>
                            <div class="catalog-card-topic">{{ .speaker.TopicTitle }}</div>
                        </div>
                        <div class="catalog-card-footer-info">
                            <span>❤️ {{ .likesCount }}</span>
                            <span>⭐ {{ .speaker.ExperienceYears }} л.</span>
                        </div>
                    </div>
                </a>
                {{ end }}
            </div>
        </div>

        <!-- Нижняя навигационная панель -->
        <nav class="tabbar">
            <a href="/feed" class="tab-item">🎬<span>Лента</span></a>
            <a href="/draft" class="tab-item">➕<span>Добавление</span></a>
            <a href="/catalog" class="tab-item active">🧱<span>Плитка</span></a>
        </nav>
    </div>
</body>
</html>
